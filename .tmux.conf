# ===== Terminal =====
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"
set -g set-clipboard on
set -s escape-time 10
set -g focus-events on
set -g extended-keys on
set -g extended-keys-format csi-u

# ===== Base behavior =====
set -g mouse on
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g allow-rename off
setw -g remain-on-exit on
setw -g mode-keys vi

# ===== Reload config =====
unbind r
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# ===== New windows / splits inherit cwd =====
bind c new-window -c "#{pane_current_path}"
unbind %
bind | split-window -h -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -c "#{pane_current_path}"

# ===== Pane navigation =====
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind Tab last-pane
bind m resize-pane -Z

# ===== Pane resizing =====
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ===== Search / tree =====
bind e choose-tree -Zw
bind f command-prompt -p "find-window" "find-window '%%'"
bind O display-popup -E -w 85% -h 85% "sesh picker"

# ===== Pane / window labels =====
set -g pane-border-status top
set -g pane-border-format "#P #{?pane_title,#{pane_title},#{pane_current_command}}"
bind , command-prompt -p "Pane title" "select-pane -T '%%'"
bind . command-prompt -I "#W" "rename-window '%%'"

# ===== Broadcast input to all panes in window =====
bind S setw synchronize-panes \; display-message "sync panes: #{?pane_synchronized,on,off}"

# ===== Copy mode (vim-like) =====
bind [ copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ===== Status bar =====
set -g status-interval 5
set -g status-left-length 60
set -g status-right-length 120
set -g status-left "#[bold] #S #[default]"
set -g status-right "#{?pane_synchronized,#[fg=red]SYNC #[default],}#[dim]#{pane_current_path} #[default]| %Y-%m-%d %H:%M"
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[bold,fg=black,bg=green] #I:#W #[default]"

# ===== Plugins (TPM) =====
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Restore sessions automatically
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @resurrect-capture-pane-contents 'on'

run '~/.tmux/plugins/tpm/tpm'
