# ===== Terminal =====
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"
set -g set-clipboard on
set -s escape-time 10
set -g focus-events on
set -g extended-keys on
set -g extended-keys-format csi-u

# ===== Base behavior =====
set -g mouse on
# Scroll = enter copy-mode + page history (don't send wheel to running app)
bind -T copy-mode-vi WheelUpPane send-keys -X -N 5 scroll-up
bind -T copy-mode-vi WheelDownPane send-keys -X -N 5 scroll-down
bind -n WheelUpPane if-shell -F "#{alternate_on}" "send-keys -M" "copy-mode -e ; send-keys -X -N 5 scroll-up"
bind -n WheelDownPane if-shell -F "#{alternate_on}" "send-keys -M" "copy-mode -e ; send-keys -X -N 5 scroll-down"
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g allow-rename off
setw -g remain-on-exit on
setw -g mode-keys vi

# ===== Reload config =====
unbind r
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# ===== New windows / splits inherit cwd =====
bind c new-window -c "#{pane_current_path}"
unbind %
bind | split-window -h -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -c "#{pane_current_path}"
# Break current pane into its own window, keeping scrollback (inspect long agent log in peace)
bind b break-pane -d -P

# ===== Splits (mirror ghostty cmd+d / cmd+shift+d) =====
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# ===== Pane navigation =====
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind Tab last-pane
bind m resize-pane -Z
# Prefix-free nav: opt+hjkl (ghostty opt+arrows never reach tmux, hjkl does)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
# Prefix-free zoom: opt+enter (mirrors ghostty cmd+shift+enter)
bind -n M-Enter resize-pane -Z

# ===== Pane resizing =====
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
# Prefix-free resize: opt+shift+hjkl
bind -n M-H resize-pane -L 5
bind -n M-J resize-pane -D 5
bind -n M-K resize-pane -U 5
bind -n M-L resize-pane -R 5

# ===== Search / tree =====
bind e choose-tree -Zw
bind f command-prompt -p "find-window" "find-window '%%'"
bind O display-popup -E -w 85% -h 85% "sesh picker"

# ===== Pane / window labels =====
set -g pane-border-status top
set -g pane-border-format "#P #{?pane_title,#{pane_title},#{pane_current_command}} #{s|/dev/||:pane_tty}"
bind , command-prompt -p "Pane title" "select-pane -T '%%'"
bind . command-prompt -I "#W" "rename-window '%%'"

# ===== Broadcast input to all panes in window =====
bind S setw synchronize-panes \; display-message "sync panes: #{?pane_synchronized,on,off}"
# Spawn a side-by-side agent pane (same cwd, 30% width) — pi/claude/codex sidekick
bind a split-window -h -p 30 -c "#{pane_current_path}"
# Open agent popup window (full screen, scratch), inherits cwd
bind A display-popup -E -w 90% -h 90% -c "#{pane_current_path}" zsh

# ===== Copy mode (vim-like) =====
bind [ copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ===== Status bar (Andromeda palette) =====
set -g status-style "bg=#23262e,fg=#d5ced9"
set -g status-interval 5
set -g status-left-length 60
set -g status-right-length 120
set -g status-left "#[bold,fg=#11a8cd] #S #[default]"
set -g status-right "#{?pane_synchronized,#[fg=#ee5d43]SYNC #[default],}#[fg=#7a7e8c]#{pane_current_path} #[default]#[fg=#c74ded] %H:%M "
setw -g window-status-format "#[fg=#7a7e8c] #I:#W "
setw -g window-status-current-format "#[bold,fg=#23262e,bg=#11a8cd] #I:#W #[default]"
set -g pane-border-style "fg=#3a3e4a"
set -g pane-active-border-style "fg=#11a8cd"
set -g message-style "bg=#23262e,fg=#11a8cd"

# ===== Plugins (TPM) =====
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
# Resume AI agents (claude/codex/pi/omp/grok/opencode) with their saved session IDs
# after restart/reboot. Hooks into resurrect's post-save/post-restore.
set -g @plugin 'timvw/tmux-assistant-resurrect'
set -g @plugin 'tmux-plugins/tmux-yank'

# Restore sessions automatically
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
# Pane scrollback saved on resurrect is governed by tmux `history-limit` (100000 above).
set -g @resurrect-capture-pane-contents 'on'
# Resurrect snapshots live here (same path used by tmux-assistant-resurrect,
# so assistant-sessions.json sits next to pane state).
set -g @resurrect-dir '~/.local/share/tmux/resurrect'

run '~/.tmux/plugins/tpm/tpm'
